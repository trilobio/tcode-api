name: Run tcode-api Unittests (Python Matrix)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tcode-api-unittests:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 100
      fail-fast: false
      matrix:
        python: ["3.12","3.13","3.14"]
    defaults:
      run:
        shell: bash
    env:
      UV_PYTHON: ${{ matrix.python }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: "Set up Python"
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      # Fails if the uv.lock file is out of sync with the pyproject.toml.
      - name: Install pinned dependencies
        run: uv sync --locked --dev

      - name: Check tcode_labware schemas are up to date
        run: uv run python scripts/migrate_schemas.py --check

      - name: Format
        run: uv run runner.py format --nofix

      - name: Lint
        run: uv run runner.py lint

      - name: Unittest
        run: uv run runner.py test

  all-tests-passed:
    needs: tcode-api-unittests
    runs-on: ubuntu-latest
    steps:
      - name: All tests passed
        run: echo "All tests passed on all supported Python versions."
